# CutefishOS dedicated installer fixed policy.
# All values are consumed by the polkit helper and are never used as shell code.
product_name=CutefishOS
default_hostname=cutefish
default_locale=en_US.UTF-8
default_timezone=Asia/Shanghai
esp_size_mib=300
minimum_disk_gib=16
firmware=uefi-only
encryption=disabled
lvm_raid=disabled
